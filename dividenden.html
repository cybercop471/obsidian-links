<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Dividenden-Reinvestition</title>
</head>
<body>
<p>Obsidian wird geöffnet…<br>
<span id="link"></span></p>
<script>
  var now = new Date();
  var y = now.getFullYear();
  var m = String(now.getMonth()+1).padStart(2,'0');
  var d = String(now.getDate()).padStart(2,'0');
  var monate = ['Januar','Februar','März','April','Mai','Juni',
                'Juli','August','September','Oktober','November','Dezember'];
  var mn = monate[now.getMonth()] + ' ' + y;
  var name = y+'-'+m+'-'+d+' Dividenden-Reinvestition';
  var inhalt = '# Dividenden-Reinvestition \u2013 '+mn+'\n\n'
    +'## Ertr\u00e4ge\n\n'
    +'| Quelle | Betrag |\n|---|---:|\n'
    +'|  | \u20ac |\n|  | \u20ac |\n|  | \u20ac |\n|  | \u20ac |\n|  | \u20ac |\n'
    +'|  | \u20ac |\n|  | \u20ac |\n|  | \u20ac |\n|  | \u20ac |\n|  | \u20ac |\n\n'
    +'## ETF-Depotwerte\n\n'
    +'| ETF | ISIN | Depotwert |\n|---|---|---:|\n'
    +'| iShares Core Euro Dividend | IE00B0M62S72 | \u20ac |\n'
    +'| Vanguard FTSE All-World High Div Yield | IE00B8GKDB10 | \u20ac |\n'
    +'| JPM USD EM Bond EUR Hedged | IE00B9M6RS56 | \u20ac |\n'
    +'| SPDR S&P Global Dividend Aristocrats | IE00B9CQXS71 | \u20ac |\n';
  var uri = 'obsidian://new?vault=Documents&name='
    +encodeURIComponent(name)+'&content='+encodeURIComponent(inhalt);
  document.getElementById('link').innerHTML =
    '<a href="'+uri+'">Falls nichts passiert \u2192 hier klicken</a>';
  window.location.href = uri;
</script>
</body>
</html>
